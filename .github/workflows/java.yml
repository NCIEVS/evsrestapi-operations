name: Operations Java and scripts
on:
  workflow_dispatch:
    inputs:
      evsrestapi_ref:
        description: Exact paired evsrestapi migration commit SHA
        required: true
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ matrix.os == 'windows-latest' && '.;src' || '.:src' }}
      OPS_BASH: ${{ matrix.os == 'windows-latest' && 'C:/Program Files/Git/bin/bash.exe' || 'bash' }}
    permissions:
      contents: read
    steps:
      - name: Preserve shell script line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: evsrestapi-operations
      - name: Require an explicitly paired source revision
        env:
          API_REF: ${{ inputs.evsrestapi_ref || vars.EVSRESTAPI_CORE_REF }}
        run: |
          [[ "$API_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set EVSRESTAPI_CORE_REF to the tested paired commit SHA'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: NCIEVS/evsrestapi
          ref: ${{ inputs.evsrestapi_ref || vars.EVSRESTAPI_CORE_REF }}
          path: evsrestapi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java checks and packaged applications
        working-directory: evsrestapi-operations/web
        run: bash gradlew spotlessCheck test integrationTest bootJar loaderJar spotbugsMain spotbugsTest
      - name: Python checks
        working-directory: evsrestapi-operations
        run: |
          pip install poetry
          poetry install
          poetry run pytest
      - name: Distribution
        working-directory: evsrestapi-operations
        run: python bin/package_distribution.py 2.6.0
      - name: Packaged applications and process lifecycle
        working-directory: evsrestapi-operations
        run: python test/distribution_smoke.py build/evsrestapi-operations-2.6.0.zip
