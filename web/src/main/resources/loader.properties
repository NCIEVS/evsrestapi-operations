spring.main.web-application-type=none
spring.cache.jcache.config=classpath:ehcache.xml
nci.evs.application.configBaseUri=${CONFIG_BASE_URI:https://raw.githubusercontent.com/NCIEVS/evsrestapi-operations/main/config/metadata}
nci.evs.application.ftpNeoplasmUrl=${FTP_NEOPLASM_URL:https://evs.nci.nih.gov/ftp1/NCI_Thesaurus/Neoplasm/}
nci.evs.application.childhoodNeoplasmSubsetsXls=${CHILDHOOD_NEOPLASM_SUBSETS_XLS:Childhood_Neoplasm_Subsets.xls}
nci.evs.application.unitTestData=${UNIT_TEST_DATA:../data/UnitTestData/NCIT/}
nci.evs.bulkload.historyFile=${NCI_EVS_HISTORY_FILE:}
nci.evs.bulkload.lockFile=${NCI_EVS_BULK_LOAD_LOCK_FILE_NAME:DownloadSuccessfull.lck}
nci.evs.bulkload.downloadBatchSize=${NCI_EVS_BULK_LOAD_DOWNLOAD_BATCH_SIZE:1000}
nci.evs.bulkload.indexBatchSize=${NCI_EVS_BULK_LOAD_INDEX_BATCH_SIZE:1000}
nci.evs.bulkload.graphDbs=${GRAPH_DBS:CTRP,NCIT2}
nci.evs.graph.host=${GRAPH_DB_HOST:localhost}
nci.evs.graph.port=${GRAPH_DB_PORT:3030}
nci.evs.graph.db=${GRAPH_DB:NCIT2}
nci.evs.graph.queryUrl=${GRAPH_DB_MONTHLY_QUERY_URL:http://${nci.evs.graph.host}:${nci.evs.graph.port}/${nci.evs.graph.db}/query}
nci.evs.graph.username=${GRAPH_DB_USERNAME:admin}
nci.evs.graph.password=${GRAPH_DB_PASSWORD:admin}
nci.evs.graph.readTimeout=${GRAPH_DB_READ_TIMEOUT:60}
nci.evs.graph.connectTimeout=${GRAPH_DB_CONNECT_TIMEOUT:60}
nci.evs.graph.batchTimeoutSeconds=${GRAPH_DB_BATCH_TIMEOUT:900}
nci.evs.opensearch.server.host=${ES_HOST:localhost}
nci.evs.opensearch.server.port=${ES_PORT:9201}
nci.evs.opensearch.server.scheme=${ES_SCHEME:http}
nci.evs.opensearch.timeout=240000
nci.evs.sparql.timeoutSeconds=60
logging.level.org.springframework=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:WARN}
logging.level.gov.nih.nci.evs.api=${LOGGING_LEVEL_GOV_NIH_NCI_EVS_API:INFO}
logging.level.org.springframework.data.elasticsearch.core=${LOGGING_LEVEL_SPRING_DATA_ES:INFO}
logging.level.org.springframework.data.opensearch.core=${LOGGING_LEVEL_SPRING_DATA_ES:INFO}
logging.level.gov.nih.nci.evs.api.configuration.EvsOpenSearchRestTemplate=${LOGGING_LEVEL_SPRING_DATA_ES:INFO}
