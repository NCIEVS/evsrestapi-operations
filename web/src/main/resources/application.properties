spring.application.name=evsrestapi-operations
spring.main.banner-mode=off
spring.http.converters.preferred-json-mapper=jackson2
server.address=${ADMIN_BIND:127.0.0.1}
server.port=${ADMIN_PORT:8083}
server.error.include-message=never
server.tomcat.accesslog.enabled=false
admin.api-key=${ADMIN_KEY:}
admin.home=${EVS_OPS_HOME:..}
admin.state-dir=${OPS_STATE_DIR:${admin.home}/var}
admin.python=${OPS_PYTHON:python3}
admin.bash=${OPS_BASH:bash}
admin.wait-seconds=${OPS_WAIT_SECONDS:300}
admin.retention-days=${OPS_RETENTION_DAYS:30}
