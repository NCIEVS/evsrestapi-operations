# Development defaults retained by the --noconfig indexing entry points.
nci.evs.application.configBaseUri=${CONFIG_BASE_URI:https://raw.githubusercontent.com/NCIEVS/evsrestapi-operations/develop/config/metadata}
nci.evs.bulkload.downloadBatchSize=${NCI_EVS_BULK_LOAD_DOWNLOAD_BATCH_SIZE:250}
nci.evs.bulkload.indexBatchSize=${NCI_EVS_BULK_LOAD_INDEX_BATCH_SIZE:250}
# The local loader follows the selected database, not the server's fixed monthly URL.
nci.evs.graph.queryUrl=http://${nci.evs.graph.host}:${nci.evs.graph.port}/${nci.evs.graph.db}/query
nci.evs.graph.readTimeout=${GRAPH_DB_READ_TIMEOUT:500}
nci.evs.graph.connectTimeout=${GRAPH_DB_CONNECT_TIMEOUT:30}
nci.evs.opensearch.timeout=200000
